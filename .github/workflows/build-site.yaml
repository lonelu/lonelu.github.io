name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write
  pages: read

jobs:
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      # google-protobuf 3.25.x invokes rake while its native extension is
      # installed, but does not declare rake as a runtime dependency.
      - name: Install Ruby packages
        run: |
          gem install rake --version 13.1.0 --no-document
          bundle install --jobs 4 --retry 3

      - name: Get Pages url
        id: pages
        uses: actions/configure-pages@v5

      - name: Set root url
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"
          touch _site/.nojekyll

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
