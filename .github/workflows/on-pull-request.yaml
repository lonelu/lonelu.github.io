name: on-pull-request
run-name: on pull request activity

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pages: read
  pull-requests: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-citations:
    uses: ./.github/workflows/update-citations.yaml

  build-preview:
    needs: update-citations
    uses: ./.github/workflows/build-preview.yaml
